# ============================================================
# Omni Solutions - configuracion principal
# Las credenciales NO se escriben aqui: se leen de variables de
# entorno o de un archivo .env en la raiz del proyecto (ver .env.example).
# ============================================================
spring.application.name=omni-solutions
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:omni_solutions}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema se crea con schema.sql (CREATE TABLE IF NOT EXISTS) al iniciar.
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
