<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Postulaciones | Omni Solutions</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="page page-narrow">
    <div class="card">
        <div class="card-title"><h1 id="titulo">Postulaciones</h1></div>
        <p class="small muted" id="descripcion"></p>
        <div class="filters">
            <select id="filtro-publicacion" aria-label="Filtrar por publicación" hidden></select>
            <div id="filtro-estado" class="filters">
                <button type="button" class="chip active" data-estado="">Todas</button>
                <button type="button" class="chip" data-estado="PENDIENTE">Pendientes</button>
                <button type="button" class="chip" data-estado="ACEPTADA">Aceptadas</button>
                <button type="button" class="chip" data-estado="RECHAZADA">Rechazadas</button>
            </div>
        </div>
    </div>
    <div class="card card-flush" id="lista"><div class="loading">Cargando…</div></div>
</main>
<script src="/js/app.js"></script>
<script src="/js/postulaciones.js"></script>
</body>
</html>
