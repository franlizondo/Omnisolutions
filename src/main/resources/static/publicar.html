<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar | Omni Solutions</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="page page-narrow">
    <div class="card">
        <div class="card-title">
            <h1 id="titulo-pagina">Nueva publicación</h1>
            <span id="tipo-badge"></span>
        </div>
        <p class="muted small" id="explicacion"></p>
        <div id="alerta" class="alert" hidden></div>

        <form id="form-publicacion" novalidate>
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" maxlength="120" required>
                <div class="hint">Entre 5 y 120 caracteres.</div>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" maxlength="2000" required></textarea>
                <div class="hint"><span id="contador">0</span>/2000 caracteres (mínimo 10).</div>
            </div>
            <div class="form-group">
                <label for="ubicacion">Ubicación <span class="muted">(opcional)</span></label>
                <input type="text" id="ubicacion" name="ubicacion" maxlength="120" placeholder="Ej.: Córdoba Capital">
            </div>
            <div class="post-actions">
                <button class="btn btn-primary" type="submit" id="btn-guardar">Publicar</button>
                <a class="btn btn-plain" href="/mis-publicaciones.html" id="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<script src="/js/app.js"></script>
<script src="/js/publicar.js"></script>
</body>
</html>
