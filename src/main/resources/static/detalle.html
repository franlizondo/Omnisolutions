<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle | Omni Solutions</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="page layout-2">
    <section>
        <div id="detalle"><div class="card loading">Cargando…</div></div>
        <div class="card card-flush" id="seccion-postulaciones" hidden>
            <div class="card-section card-title">
                <h2>Postulaciones recibidas</h2>
                <span class="small muted" id="resumen-postulaciones"></span>
            </div>
            <div id="lista-postulaciones"></div>
        </div>
    </section>
    <aside>
        <div class="card" id="autor" hidden></div>
        <div class="card">
            <h2 class="card-title">¿Cómo funciona?</h2>
            <ul class="tips">
                <li>Solo los empleados pueden postularse, y únicamente a trabajos activos.</li>
                <li>El empleador acepta o rechaza cada postulación por separado.</li>
                <li>Con una postulación aceptada, ambas partes pueden ver el teléfono de la otra.</li>
            </ul>
        </div>
    </aside>
</main>
<script src="/js/app.js"></script>
<script src="/js/detalle.js"></script>
</body>
</html>
